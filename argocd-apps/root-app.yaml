apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: asma-app-of-apps
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Asmasaiyed104/AI-BankApp-DevOps.git
    targetRevision: feat/gitops
    path: argocd-apps
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
